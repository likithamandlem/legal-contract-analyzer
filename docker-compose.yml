version: "3.8"

services:
  api:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./vectorstore:/app/vectorstore
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped